# main mirrors driceroland/Search:main, fast-forward only. A 409 means
# someone committed to main by hand; fix the branch, not this file.
name: sync
on:
  schedule: [{ cron: "17 */6 * * *" }]
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api --method POST "repos/${{ github.repository }}/merge-upstream" -f branch=main
